 <div class="flex flex-col gap-2 rounded-lg border border-(--color-surface-alt) bg-(--color-surface) p-4">
      <div class="flex items-start justify-between gap-3">
        <a [routerLink]="['/lists', list().id]" class="font-medium hover:text-(--color-accent)">
          {{ list().name }}
        </a>
        @if (showFollowButton()) {
          <button
            (click)="follow.emit()"
            class="shrink-0 rounded-md px-3 py-1 text-xs font-medium transition-colors"
            [class]="list().isFollowedByMe
              ? 'border border-(--color-surface-alt) text-(--color-text-muted)'
              : 'bg-(--color-accent) text-[#14151a]'"
          >
            {{ list().isFollowedByMe ? 'Siguiendo ✓' : 'Seguir' }}
          </button>
        }
      </div>

      @if (list().description) {
        <p class="line-clamp-2 text-xs text-(--color-text-muted)">{{ list().description }}</p>
      }

      <div class="flex flex-wrap items-center gap-x-2 gap-y-1 text-xs text-(--color-text-muted)">
        <a [routerLink]="['/users', list().ownerId]" class="hover:text-(--color-accent)">
          {{ list().ownerDisplayName }}
        </a>
        <span>·</span>
        <span>{{ list().itemCount }} mangas</span>
        <span>·</span>
        <span>{{ list().followerCount }} seguidores</span>
      </div>
    </div>
