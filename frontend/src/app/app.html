<app-navbar />
 @if (auth.isAuthenticated() && reminder.shouldShow()) {

        <span>Hace tiempo que no hacés un backup de tus listas.</span>

          <a routerLink="/backup" class="text-(--color-accent) hover:underline">Hacer backup</a>

        </div>
      </div>
    }
    
<main class="mx-auto max-w-5xl px-6 py-10">
