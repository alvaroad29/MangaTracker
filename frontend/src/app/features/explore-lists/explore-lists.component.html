<div class="flex flex-col gap-6">
  <h1 class="font-display text-2xl text-(--color-accent)">EXPLORAR LISTAS</h1>

  <div class="flex max-w-xl gap-2">
    <input
      type="text"
      placeholder="Buscar listas por nombre..."
      [value]="query()"
      (input)="onInput($any($event.target).value)"
      (keydown.enter)="submit()"
      class="flex-1 rounded-md border border-(--color-surface-alt) bg-(--color-surface) px-4 py-2.5 text-sm outline-none focus:border-(--color-accent)"
    />
    <button
      (click)="submit()"
      class="rounded-md bg-(--color-accent) px-5 py-2.5 text-sm font-medium text-[#14151a] hover:bg-(--color-accent-hover)"
    >
      Buscar
    </button>
  </div>

  @if (loading()) {
    <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
      @for (i of [1, 2, 3, 4]; track i) {
        <app-list-card-skeleton />
      }
    </div>
  } @else if (response(); as response) {
    @if (response.items.length === 0) {
      <p class="text-(--color-text-muted)">No encontramos listas públicas.</p>
    } @else {
      <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
        @for (list of response.items; track list.id) {
          <app-list-card [list]="list" (follow)="toggleFollow(list)" />
        }
      </div>

      @if (response.lastVisiblePage > 1) {
        <shared-pagination
          [currentPage]="response.currentPage"
          [lastVisiblePage]="response.lastVisiblePage"
          [totalItemsCount]="response.totalItemsCount"
        />
      }
    }
  }
</div>
