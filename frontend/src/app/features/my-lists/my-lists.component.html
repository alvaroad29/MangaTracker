<div class="flex flex-col gap-6">
  <div class="flex items-center justify-between">
    <h1 class="font-display text-2xl text-(--color-accent)">MIS LISTAS</h1>
    <a
      routerLink="/lists/new"
      class="rounded-md bg-(--color-accent) px-4 py-1.5 text-sm font-medium text-[#14151a] hover:bg-(--color-accent-hover)"
    >
      + Nueva lista
    </a>
  </div>

  @if (loading()) {
    <p class="text-(--color-text-muted)">Cargando...</p>
  } @else if (lists().length === 0) {
    <p class="text-(--color-text-muted)">Todavía no creaste ninguna lista.</p>
  }

  <div class="flex flex-col gap-3">
    @for (list of lists(); track list.id) {
      <div class="flex items-center justify-between rounded-lg border border-(--color-surface-alt) bg-(--color-surface) p-4">
        <a [routerLink]="['/lists', list.id]" class="flex flex-col">
          <span class="font-medium hover:text-(--color-accent)">{{ list.name }}</span>
          <span class="text-xs text-(--color-text-muted)">
            {{ list.itemCount }} mangas · {{ list.isPublic ? 'Pública' : 'Privada' }}
          </span>
        </a>

        <div class="flex items-center gap-3 text-xs">
          <a [routerLink]="['/lists', list.id, 'edit']" class="text-(--color-accent-2) hover:underline">
            Editar
          </a>
          <button (click)="pendingDelete.set(list)" class="text-(--color-danger) hover:underline">
            Borrar
          </button>
        </div>
      </div>
    }
  </div>
</div>

<app-confirm-modal
  [open]="pendingDelete() !== null"
  [confirming]="deleting()"
  title="Borrar lista"
  [message]="'Se va a borrar &quot;' + (pendingDelete()?.name ?? '') + '&quot; y todas sus referencias a mangas. Esta acción no se puede deshacer.'"
  confirmLabel="Sí, borrar"
  (confirm)="confirmDelete()"
  (cancel)="pendingDelete.set(null)"
/>
